# Mise en ligne sur Render (https://render.com) : New > Blueprint > choisir ce dépôt.
# Le disque persistant conserve la base de données entre les redémarrages.
services:
  - type: web
    name: station-service
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/station.db
      - key: DEMO_SEED # Essais uniquement : complète les cuves sous 50 % au démarrage. À retirer en production.
        value: "1"
      - key: TZ
        value: Africa/Lubumbashi # Goma (UTC+2) : fuseau horaire des rapports "du jour"
      - key: APP_URL
        value: https://station.mtgindustrie.com # adresse des liens dans les mails
      - key: MAIL_FROM
        value: MTG Station <station@mtgindustrie.com>
      - key: RESEND_API_KEY # clé Resend : à saisir dans le tableau de bord Render, jamais dans ce fichier
        sync: false
      - key: ANTHROPIC_API_KEY # clé de l’API Claude (index lus sur photo) : à saisir dans Render, jamais dans ce fichier
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
