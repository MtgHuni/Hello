# Mise en ligne sur Render (https://render.com) : New > Blueprint > choisir ce dépôt.
# Le disque persistant conserve la base de données entre les redémarrages.
services:
  - type: web
    name: station-service
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/setup
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/station.db
      - key: TZ
        value: Africa/Kinshasa # fuseau horaire de la station (pour les rapports "du jour")
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
